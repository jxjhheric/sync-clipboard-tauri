name: 🛠️ 自动构建

on:
  push:
    branches:
      - dev
  pull_request_target:
    branches:
      - dev

jobs:
  auto-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: aarch64-linux-android

    name: 🛠️ 自动构建
    runs-on: ${{ matrix.os }}
    steps:
      - name: 选择 Checkout 目标 (Decide repo/ref)
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "repo=${{ github.event.pull_request.head.repo.full_name }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          else
            echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: 检出代码 (Checkout)
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pick.outputs.repo }}
          ref: ${{ steps.pick.outputs.ref }}
          fetch-depth: 0
          # 对于 PR，建议禁用默认 GITHUB_TOKEN 凭据，降低风险
          persist-credentials: false

      - name: 安装依赖(Install dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装 Rust (Install Rust)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存 (Rust cache)
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          workspaces: './src-tauri -> target'

      - name: 安装 pnpm (Install pnpm)
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 安装 Node.js (Install Node.js)
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: 安装前端依赖 (Install frontend dependencies)
        run: pnpm install

      - name: 安装 rust target (Install rust target)
        run: rustup target add ${{ matrix.target }}

      - name: 安装 Java (Install Java)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '21'

      - name: 安装 Android SDK (Setup Android SDK)
        uses: android-actions/setup-android@v3

      - name: 安装 NDK (Install NDK)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false
          link-to-sdk: true

      - name: 创建 keystore (Create keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: src-tauri/gen/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore.jks

          # 将 keystore 转换为 JKS 格式，确保兼容性
          TEMP_DIR=$(mktemp -d)

          keytool -importkeystore \
            -srckeystore app/keystore.jks \
            -srcstoretype PKCS12 \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destkeystore "$TEMP_DIR/temp.jks" \
            -deststoretype JKS \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -noprompt 2>/dev/null || \
          keytool -importkeystore \
            -srckeystore app/keystore.jks \
            -srcstoretype JKS \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destkeystore "$TEMP_DIR/temp.jks" \
            -deststoretype JKS \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -noprompt 2>/dev/null || true

          if [ -f "$TEMP_DIR/temp.jks" ]; then
            mv "$TEMP_DIR/temp.jks" app/keystore.jks
          fi

          rm -rf "$TEMP_DIR"

          # 创建 keystore.properties 文件
          cat > keystore.properties << EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=keystore.jks
          EOF

      - name: 构建应用 (Build app)
        run: |
          pnpm tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 上传编译结果到 Artifact (Upload build result to Artifact)
        uses: actions/upload-artifact@v5
        with:
          if-no-files-found: ignore
          name: '${{ matrix.target }}-${{ github.sha }}'
          path: |
            ./src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

  upload-to-release-alpha:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    name: 📤 上传到 alpha 版本 (Upload to alpha release)
    needs: auto-build
    runs-on: ubuntu-22.04
    steps:
      - name: 克隆仓库 (Checkout repo)
        uses: actions/checkout@v5

      - name: 下载 Artifact (Download Artifact)
        uses: actions/download-artifact@v6
        with:
          path: ./download
          merge-multiple: true

      - name: 读取 Unreleased Changelog (Read Unreleased Changelog)
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2.2.3
        with:
          version: 'Unreleased'
          path: './CHANGELOG.md'

      - name: 提取 Unreleased 对比链接 (Extract Unreleased Compare Link)
        id: changelog_link
        run: |
          # 1. 用 grep 找到以 "[Unreleased]:" 开头的行
          # 2. 用 awk 按空格分割，打印第二个字段 (即 URL)
          # 3. 将 URL 保存到 GitHub Actions 的 output
          URL=$(grep "\[Unreleased\]:" CHANGELOG.md | awk '{print $2}')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: 上传编译结果到 pre-release (Upload build result to pre-release)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: alpha
          commit: ${{ github.sha }}
          body: |
            ${{ steps.changelog_reader.outputs.description || steps.changelog_reader.outputs.changes }}

            ---
            **Full Changelog**: ${{ steps.changelog_link.outputs.url }}
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
          artifacts: |
            ./download/**/*
