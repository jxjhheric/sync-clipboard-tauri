name: 📱 构建 APK (Build APK)

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标 (Build Target)'
        required: true
        default: 'aarch64-linux-android'
        type: choice
        options:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android
      release_type:
        description: '发布类型 (Release Type)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  
  # 推送到特定分支时自动触发
  push:
    branches:
      - ci-github-actions-build-apk
      - develop
      - feature/*
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tauri.conf.json'
      - 'vite.config.ts'

  # Pull Request 时触发
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tauri.conf.json'
      - 'vite.config.ts'

jobs:
  build-apk:
    name: 📱 构建 APK (${{ matrix.target }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        target:
          # 默认只构建 ARM64，如需构建其他架构，可通过手动触发选择
          - ${{ github.event.inputs.target || 'aarch64-linux-android' }}

    steps:
      - name: 📥 检出代码 (Checkout)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 📦 安装系统依赖 (Install system dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 🦀 安装 Rust (Install Rust)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 💾 Rust 缓存 (Rust cache)
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          workspaces: './src-tauri -> target'

      - name: 📦 安装 pnpm (Install pnpm)
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 🟢 安装 Node.js (Install Node.js)
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: 📦 安装前端依赖 (Install frontend dependencies)
        run: pnpm install --frozen-lockfile

      - name: ☕ 安装 Java (Install Java)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '21'

      - name: 🤖 安装 Android SDK (Setup Android SDK)
        uses: android-actions/setup-android@v3

      - name: 🔧 安装 NDK (Install NDK)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false
          link-to-sdk: true

      - name: 🔐 创建 Keystore (Create keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: src-tauri/gen/android
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            # 创建 keystore.properties 文件
            cat > keystore.properties << EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=keystore.jks
          EOF
            echo "✅ Keystore 创建成功"
          else
            echo "⚠️ 未配置 Keystore，将使用 debug 签名"
          fi

      - name: 🔨 构建应用 (Build app)
        run: |
          # 确定构建类型
          BUILD_TYPE="${{ github.event.inputs.release_type || 'release' }}"
          
          # 构建命令
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "🔨 构建 Debug APK..."
            pnpm tauri android build --apk --target ${{ matrix.target }} --debug
          else
            echo "🔨 构建 Release APK..."
            pnpm tauri android build --apk --target ${{ matrix.target }}
          fi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 📋 获取构建信息 (Get build info)
        id: build_info
        run: |
          # 获取版本号
          VERSION=$(jq -r '.version' ./src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # 获取构建时间
          BUILD_TIME=$(date -u +"%Y%m%d-%H%M%S")
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          
          # 获取 commit hash
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          
          # 获取分支名
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: 📦 重命名 APK (Rename APK)
        id: rename_apk
        run: |
          BUILD_TYPE="${{ github.event.inputs.release_type || 'release' }}"
          VERSION="${{ steps.build_info.outputs.version }}"
          BUILD_TIME="${{ steps.build_info.outputs.build_time }}"
          COMMIT_HASH="${{ steps.build_info.outputs.commit_hash }}"
          BRANCH_NAME="${{ steps.build_info.outputs.branch_name }}"
          
          # 确定架构名称
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              ARCH="arm64-v8a"
              ;;
            armv7-linux-androideabi)
              ARCH="armeabi-v7a"
              ;;
            x86_64-linux-android)
              ARCH="x86_64"
              ;;
            i686-linux-android)
              ARCH="x86"
              ;;
            *)
              ARCH="${{ matrix.target }}"
              ;;
          esac
          
          # 确定构建类型后缀
          if [ "$BUILD_TYPE" = "debug" ]; then
            TYPE_SUFFIX="-debug"
          else
            TYPE_SUFFIX=""
          fi
          
          # 查找 APK 文件
          APK_PATH=$(find ./src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          
          if [ -n "$APK_PATH" ]; then
            # 生成新文件名
            NEW_NAME="sync-clipboard-tauri-${VERSION}-${ARCH}${TYPE_SUFFIX}-${BUILD_TIME}.apk"
            mv "$APK_PATH" "./$NEW_NAME"
            echo "apk_path=./$NEW_NAME" >> $GITHUB_OUTPUT
            echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT
            echo "✅ APK 重命名完成: $NEW_NAME"
          else
            echo "❌ 未找到 APK 文件"
            exit 1
          fi

      - name: 📤 上传 APK 到 Artifact (Upload APK to Artifact)
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.rename_apk.outputs.apk_name }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: 📊 构建摘要 (Build Summary)
        run: |
          echo "## 📱 APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 构建信息" >> $GITHUB_STEP_SUMMARY
          echo "- **版本**: ${{ steps.build_info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **架构**: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **构建类型**: ${{ github.event.inputs.release_type || 'release' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ steps.build_info.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ steps.build_info.outputs.commit_hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **构建时间**: ${{ steps.build_info.outputs.build_time }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 文件信息" >> $GITHUB_STEP_SUMMARY
          echo "- **文件名**: ${{ steps.rename_apk.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **下载**: 查看 Actions 的 Artifacts 部分" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 快速链接" >> $GITHUB_STEP_SUMMARY
          echo "- [下载 APK](../../actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # 多架构构建任务（仅在手动触发时启用）
  build-multiple-architectures:
    name: 🏗️ 多架构构建 (Multiple Architectures)
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'all'
    
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android

    steps:
      - name: 📥 检出代码 (Checkout)
        uses: actions/checkout@v5

      - name: 📦 安装系统依赖 (Install system dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 🦀 安装 Rust (Install Rust)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 💾 Rust 缓存 (Rust cache)
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          workspaces: './src-tauri -> target'

      - name: 📦 安装 pnpm (Install pnpm)
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 🟢 安装 Node.js (Install Node.js)
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: 📦 安装前端依赖 (Install frontend dependencies)
        run: pnpm install --frozen-lockfile

      - name: ☕ 安装 Java (Install Java)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '21'

      - name: 🤖 安装 Android SDK (Setup Android SDK)
        uses: android-actions/setup-android@v3

      - name: 🔧 安装 NDK (Install NDK)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false
          link-to-sdk: true

      - name: 🔐 创建 Keystore (Create keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: src-tauri/gen/android
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            cat > keystore.properties << EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=keystore.jks
          EOF
          fi

      - name: 🔨 构建应用 (Build app)
        run: |
          BUILD_TYPE="${{ github.event.inputs.release_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            pnpm tauri android build --apk --target ${{ matrix.target }} --debug
          else
            pnpm tauri android build --apk --target ${{ matrix.target }}
          fi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 📦 重命名并上传 APK (Rename and upload APK)
        run: |
          VERSION=$(jq -r '.version' ./src-tauri/tauri.conf.json)
          BUILD_TIME=$(date -u +"%Y%m%d-%H%M%S")
          BUILD_TYPE="${{ github.event.inputs.release_type || 'release' }}"
          
          case "${{ matrix.target }}" in
            aarch64-linux-android) ARCH="arm64-v8a" ;;
            armv7-linux-androideabi) ARCH="armeabi-v7a" ;;
            x86_64-linux-android) ARCH="x86_64" ;;
            i686-linux-android) ARCH="x86" ;;
            *) ARCH="${{ matrix.target }}" ;;
          esac
          
          [ "$BUILD_TYPE" = "debug" ] && TYPE_SUFFIX="-debug" || TYPE_SUFFIX=""
          
          APK_PATH=$(find ./src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          NEW_NAME="sync-clipboard-tauri-${VERSION}-${ARCH}${TYPE_SUFFIX}-${BUILD_TIME}.apk"
          mv "$APK_PATH" "./$NEW_NAME"
          
          echo "✅ 构建完成: $NEW_NAME"

      - name: 📤 上传 APK (Upload APK)
        uses: actions/upload-artifact@v5
        with:
          name: multi-arch-${{ matrix.target }}
          path: "*.apk"
          retention-days: 30